name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows self-test
        shell: powershell
        run: |
          $result = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\CodexMonitor.ps1 -Mode SelfTest
          $parsed = $result | ConvertFrom-Json
          if (-not $parsed.passed) {
            throw ($parsed | ConvertTo-Json -Depth 10)
          }
          $parsed | ConvertTo-Json -Compress

      - name: Package Windows ZIP
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Quota-Orb-Windows
          path: dist/Codex-Quota-Orb-Windows.zip
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and parse self-test
        working-directory: macos/CodexQuotaOrb
        run: |
          swift build --configuration release
          "$(swift build --configuration release --show-bin-path)/CodexQuotaOrb" --self-test

      - name: Package native app and DMG
        working-directory: macos/CodexQuotaOrb
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-app.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Quota-Orb-macOS
          path: macos/CodexQuotaOrb/dist/Codex-Quota-Orb-macOS.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: Codex-Quota-Orb-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          args=(
            "${GITHUB_REF_NAME}"
            "release-assets/Codex-Quota-Orb-Windows.zip"
            "release-assets/Codex-Quota-Orb-macOS.dmg"
            --verify-tag
            --title "Codex Quota Orb ${GITHUB_REF_NAME} · Windows + macOS"
          )
          if [[ -f "$notes" ]]; then
            gh release create "${args[@]}" --notes-file "$notes"
          else
            gh release create "${args[@]}" --generate-notes
          fi
